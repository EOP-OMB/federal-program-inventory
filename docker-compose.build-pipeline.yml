services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.chainguard
    ports:
      - "8000:8000"
    environment:
      - ES_HOST=elasticsearch
      - ES_PORT=9200
      - ES_SCHEME=http
  website:
    build:
      context: ./website
      dockerfile: Dockerfile.chainguard
      args:
        TEST_ENV: ${TEST_ENV:-false}
        USE_LOCAL_API: ${USE_LOCAL_API:-false}
    ports:
      - "8080:8080"
  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile.chainguard
      args:
        TEST_ENV: ${TEST_ENV:-false}
    volumes:
      - ./website/data:/app/data
    working_dir: /app/indexer
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ES_HOST=elasticsearch
      - ES_PORT=9200
    command: ["python", "-u", "index_programs.py"]
    networks:
      - internal
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.7
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false  # Disable security features
      - xpack.security.transport.ssl.enabled=false  # Disable transport SSL
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
    mem_limit: 8g
    mem_reservation: 4g
    ports:
      - "9200:9200"         # Expose Elasticsearch on port 9200
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  esdata:
    driver: local

networks:
  internal:
    driver: bridge