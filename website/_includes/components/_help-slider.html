<!-- Help Slider Component -->
<div class="help-slider">
  <!-- Close Button -->
  <button class="help-slider-close" aria-label="Close help panel">
    <svg class="usa-icon" aria-hidden="true" focusable="false" role="img">
      <use href="/assets/img/sprite.svg#close"></use>
    </svg>
  </button>
  
  <!-- Slider Container -->
  <div class="help-slider-container">
    <!-- Header Section -->
    <div class="help-slider-header">
      <svg class="usa-icon help-slider-icon" aria-hidden="true" focusable="false" role="img">
        <use href="/assets/img/sprite.svg#info"></use>
      </svg>
      <h2 class="help-slider-title">Help</h2>
    </div>
    <!-- Content Section -->
    <div class="help-slider-content">
      <p class="help-slider-text">Select an info icon to view help content.</p>
    </div>
  </div>
</div>
