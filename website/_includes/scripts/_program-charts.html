<script>
// Program-specific chart initialization and data handling
// This file contains the main chart rendering function for program pages

// Outlays Chart Implementation
function renderOutlaysChart() {
  try {
    // Test if createBarChart function exists
    if (typeof createBarChart === 'undefined') {
      document.getElementById('outlaysChartContainer').innerHTML = 
        '<p class="text-center margin-y-4 text-base-darker">Chart function not available.</p>';
      return;
    }
    
    // Parse outlays data from Jekyll
    const outlaysDataString = '{{page.outlays | jsonify}}';
    
    // Handle potential double-encoding from Jekyll
    let outlaysData;
    try {
      // First try direct parsing
      outlaysData = JSON.parse(outlaysDataString);
    } catch (e) {
      try {
        // If that fails, the data might be a JSON string within a string
        const unescaped = outlaysDataString.replace(/\\"/g, '"');
        outlaysData = JSON.parse(unescaped);
      } catch (e2) {
        // Last resort: try parsing the page.outlays directly
        outlaysData = JSON.parse('{{page.outlays}}');
      }
    }
    
    if (!outlaysData || outlaysData.length === 0) {
      document.getElementById('outlaysChartContainer').innerHTML = 
        '<p class="text-center margin-y-4 text-base-darker">No expenditure data available for this program.</p>';
      return;
    }

    // Prepare data for vertical bar chart
    const chartData = outlaysData.map(d => ({
      year: d.x,  // Just the year, not "FY 2023"
      value: parseFloat(d.outlay) || 0
    }));
    
    // Create vertical bar chart with D3 (since createBarChart makes horizontal charts)
    renderVerticalBarChart(chartData, 'outlaysChart', 'outlay');
    
    // Create obligation chart using the same function but with different styling
    const obligationChartData = outlaysData.map(d => ({
      year: d.x,
      value: parseFloat(d.obligation) || 0
    }));
    
    // Update obligation chart title
    const firstYear = obligationChartData[0]?.year;
    const lastYear = obligationChartData[obligationChartData.length - 1]?.year;
    if (firstYear && lastYear) {
      document.getElementById('obligationChartTitle').textContent = 
        `Obligation History (${firstYear} - ${lastYear})`;
    }
    
    renderVerticalBarChart(obligationChartData, 'obligationChart', 'obligation', 'Obligation', true, true);
    
    // Populate the detailed obligations table
    populateObligationsTable(obligationChartData);
    
    // Update summary card with dynamic data
    updateSummaryCard(outlaysData);

  } catch (error) {
    document.getElementById('outlaysChartContainer').innerHTML = 
      '<p class="text-center margin-y-4 text-base-darker">Error loading chart data: ' + error.message + '</p>';
  }
}

// Initialize chart when page loads
document.addEventListener('DOMContentLoaded', function() {
  // Initialize chart when page loads
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(renderOutlaysChart, 100);
    });
  } else {
    setTimeout(renderOutlaysChart, 100);
  }
});
</script>
