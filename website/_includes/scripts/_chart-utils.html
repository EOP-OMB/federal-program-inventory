<script>
// Chart Utilities - Reusable Functions

function formatDollarAmount(amount) {
  if (amount === 0) {
    return "$0";
  }

  let prefix = '$';
  if (amount < 0) {
    prefix = '-$';
  }

  return prefix + new Intl.NumberFormat('en-US', {
    notation: 'compact'
  }).format(Math.abs(amount));
}

// outlays and other program spending have different raw data representations
// this function standardizes them for display in D3
function standardizeOutlaysAndObligationsForD3(rawData) {
  function formatOutlayData(rawData) {
    let formattedData = {
      "obligations": [],
      "outlays": []
    };
    let nonZeroDataSeen = false;

    if (rawData && rawData.length > 0) {
      for (let i = 0; i < rawData.length; ++i) {
        // append the data if we have previously appended data,
        //   obligations are nonzero, or outlays are nonzero
        if (nonZeroDataSeen ||
          rawData[i]["obligation"] != 0 ||
          rawData[i]["outlay"] != 0) {

          nonZeroDataSeen = true;

          formattedData.obligations.push({
            "year": parseInt(rawData[i]["x"], 10),
            "value": rawData[i]["obligation"]
          });

          formattedData.outlays.push({
            "year": parseInt(rawData[i]["x"], 10),
            "value": rawData[i]["outlay"]
          });
        }
      }
    }
    return formattedData;
  }

  function formatOtherSpendingData(rawData) {
    let formattedData = {
      "obligations": [],
      "outlays": []
    };
    let nonZeroDataSeen = false;

    if (rawData && rawData.length > 0) {
      for (let i = 0; i < rawData.length; ++i) {
        let outlays = 0;
        let forgoneRevenue = 0;

        if ('outlays' in rawData[i]) {
          outlays = rawData[i]["outlays"];
        }

        if ('forgone_revenue' in rawData[i]) {
          forgoneRevenue = rawData[i]["forgone_revenue"];
        }

        // append the data if we have previously appended data,
        //   obligations are nonzero, or outlays are nonzero
        if (nonZeroDataSeen || outlays != 0 || forgoneRevenue != 0) {
          nonZeroDataSeen = true;

          formattedData.obligations.push({
            "year": parseInt(rawData[i]["x"], 10),
            "value": 0
          });

          formattedData.outlays.push({
            "year": parseInt(rawData[i]["x"], 10),
            "value": outlays + forgoneRevenue
          });
        }
      }
    }
    return formattedData;
  }

  let spendingData = {
    "obligations": [],
    "outlays": []
  };

  if (rawData && rawData.length > 0) {
    if ("outlay" in rawData[0]) {
      spendingData = formatOutlayData(rawData);
    } else {
      spendingData = formatOtherSpendingData(rawData);
    }
  }

  return spendingData;
}

// Custom vertical bar chart function - refactored for reusability
function renderVerticalBarChart(data, chartId, dataKey, tooltipLabel = 'FY', showAxes = false, useObligationColors = false) {
  // Clear existing chart
  d3.select(`#${chartId}`).selectAll("*").remove();

  // Chart dimensions - adjust margins based on whether we show axes
  // For obligation chart, use full container width with fallback; for others use fixed width
  const containerElement = document.getElementById(`${chartId}Container`);
  let containerWidth;
  if (useObligationColors) {
    // For obligation chart, get actual width or use reasonable fallback
    containerWidth = containerElement.offsetWidth || containerElement.clientWidth || 400;
  } else {
    // For expenditure chart, use existing logic
    containerWidth = containerElement.offsetWidth || 232;
  }
  const containerHeight = 250;
  const margin = showAxes ? 
    { top: 10, right: 15, bottom: 40, left: 60 } : 
    { top: 10, right: 15, bottom: 25, left: 15 };
  const width = containerWidth - margin.left - margin.right;
  const height = containerHeight - margin.top - margin.bottom;

  // Create SVG
  const svg = d3.select(`#${chartId}`)
    .append("svg")
    .attr("width", containerWidth)
    .attr("height", containerHeight);

  const g = svg.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  // Scales
  const x = d3.scaleBand()
    .domain(data.map(d => d.year))
    .range([0, width])
    .padding(0.2);

  const y = d3.scaleLinear()
    .domain([0, d3.max(data, d => d.value)])
    .nice()
    .range([showAxes ? height : height - 20, 0]);

  // Add axes if requested
  if (showAxes) {
    // X Axis - dotted line, no tick marks
    g.append("g")
      .attr("transform", `translate(0,${height})`)
      .call(d3.axisBottom(x).tickSize(0))
      .select(".domain")
      .style("stroke-dasharray", "2,2")
      .style("stroke", "#1b1b1b");
      
    // Remove tick marks and style x-axis text
    g.selectAll(".tick text")
      .style("font-size", "12px")
      .style("fill", "#1b1b1b");
      
    // Y Axis - remove the main axis line, create horizontal grid lines
    const yTicks = y.ticks(4);
    
    // Remove default y-axis
    g.append("g")
      .call(d3.axisLeft(y).ticks(4).tickSize(0).tickFormat(d => {
        const value = d;
        return new Intl.NumberFormat('en-US', {
          style: 'currency',
          currency: 'USD',
          notation: 'compact',
          minimumFractionDigits: 0,
          maximumFractionDigits: 1
        }).format(value);
      }))
      .select(".domain")
      .remove();
      
    // Add horizontal grid lines across the chart
    g.selectAll(".grid-line")
      .data(yTicks)
      .enter()
      .append("line")
      .attr("class", "grid-line")
      .attr("x1", 0)
      .attr("x2", width)
      .attr("y1", d => y(d))
      .attr("y2", d => y(d))
      .style("stroke", "#ddd")
      .style("stroke-width", 1);
      
    // Style y-axis text
    g.selectAll(".tick text")
      .style("font-size", "12px")
      .style("fill", "#1b1b1b");
  }

  // Create bars
  g.selectAll(".bar")
    .data(data)
    .enter().append("rect")
    .attr("class", "bar")
    .attr("x", d => x(d.year))
    .attr("width", x.bandwidth())
    .attr("y", d => y(d.value))
    .attr("height", d => showAxes ? height - y(d.value) : height - 20 - y(d.value))
    .attr("fill", function(d, i) {
      if (useObligationColors) {
        // Most recent year: purple (#8e4ec6, text-primary), others: green (#00a91c, text-secondary)
        return i === data.length - 1 ? '#8e4ec6' : '#00a91c';
      } else {
        // Default blue for outlay charts
        return '#005ea2';
      }
    })
    .attr("stroke", useObligationColors ? 'none' : "#1a4480")
    .attr("stroke-width", useObligationColors ? 0 : 1)
    .on('mouseover', function(event, d) {
      // Create tooltip
      const tooltip = d3.select('body').append('div')
        .attr('class', 'chart-tooltip')
        .style('opacity', 0)
        .style('position', 'absolute')
        .style('background', 'rgba(0, 0, 0, 0.8)')
        .style('color', 'white')
        .style('padding', '8px')
        .style('border-radius', '4px')
        .style('font-size', '12px')
        .style('pointer-events', 'none')
        .style('z-index', '1000');
        
      const formattedValue = new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        notation: useObligationColors ? 'standard' : 'compact',
        minimumFractionDigits: 0,
        maximumFractionDigits: 2
      }).format(d.value);
      
      const tooltipText = useObligationColors ? 
        `${d.year} - ${tooltipLabel}: ${formattedValue}` : 
        `${tooltipLabel} ${d.year}: ${formattedValue}`;
      
      tooltip.html(tooltipText)
        .style('left', (event.pageX + 10) + 'px')
        .style('top', (event.pageY - 10) + 'px')
        .transition()
        .duration(200)
        .style('opacity', 1);
    })
    .on('mouseout', function() {
      d3.selectAll('.chart-tooltip')
        .transition()
        .duration(200)
        .style('opacity', 0)
        .remove();
    });

  // Add year labels below bars only if not showing axes
  if (!showAxes) {
    g.selectAll(".year-label")
      .data(data)
      .enter().append("text")
      .attr("class", "year-label")
      .attr("x", d => x(d.year) + x.bandwidth() / 2)
      .attr("y", height - 5)
      .attr("text-anchor", "middle")
      .attr("font-size", "12px")
      .attr("fill", "#1b1b1b")
      .text(d => d.year);
  }
}

// Function to populate a two-column table with year and value data
function populateTable(data, tableName) {
  const tableBody = document.getElementById(`${tableName}-table-body`);
  if (!tableBody) return;
  
  // Clear existing content
  tableBody.innerHTML = '';
  
  // Sort data by year (ascending)
  const sortedData = data.sort((a, b) => parseInt(a.year) - parseInt(b.year));
  
  // Create rows for each year
  sortedData.forEach(item => {
    const row = document.createElement('tr');
    
    // Fiscal Year column (left-aligned)
    const yearCell = document.createElement('td');
    yearCell.className = 'text-left text-ink padding-2';
    yearCell.textContent = item.year;
    
    // Amount column (right-aligned)
    const amountCell = document.createElement('td');
    amountCell.className = 'text-right text-ink padding-2';
    const formattedAmount = new Intl.NumberFormat('en-US', {
      style: 'currency',
      currency: 'USD',
      minimumFractionDigits: 0,
      maximumFractionDigits: 0
    }).format(item.value);
    amountCell.textContent = formattedAmount;
    
    row.appendChild(yearCell);
    row.appendChild(amountCell);
    tableBody.appendChild(row);
  });
}

function renderTreeMap(data, chartId, dataKey, color){
  // Clear existing chart
  d3.select(`#${chartId}`).selectAll("*").remove();

  const containerElement = document.getElementById(`${chartId}Container`);
  const containerWidth = containerElement.offsetWidth || 250;
  const containerHeight = 500;

  const margin = {top: 0, right: 0, bottom: 0, left: 0};
  const width = containerWidth - margin.left - margin.right;
  const height = containerHeight - margin.top - margin.bottom;

  const svg = d3.select(`#${chartId}`)
    .append("svg")
    .attr("width", containerWidth)
    .attr("height", containerHeight);

  const g = svg.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  const root = d3.hierarchy(data).sum(d => d.value).sort((a,b) => b.value - a.value);

  const treeMap = d3.treemap()
    .size([width, height])
    .padding(1)
    (root);


  // Create clipPath definitions for text clipping
  svg.append("defs").selectAll("clipPath")
    .data(root.leaves())
    .enter().append("clipPath")
    .attr("id", function(d, i) { return "clip-" + i; })
    .append("rect")
    .attr("x", function(d) { return d.x0; })
    .attr("y", function(d) { return d.y0; })
    .attr("width", function(d) { return d.x1 - d.x0; })
    .attr("height", function(d) { return d.y1 - d.y0; });

  g.selectAll("rect")
    .data(root.leaves())
    .enter()
    .append("rect")
      .attr('x', function (d) { return d.x0; })
      .attr('y', function (d) { return d.y0; })
      .attr('width', function (d) { return d.x1 - d.x0; })
      .attr('height', function (d) { return d.y1 - d.y0; })
      .style("stroke", "white")
      .style("stroke-width", 2)
      .style("fill", color)
      .style("cursor", "pointer")
    // Navigate to the program detail when a tile is clicked.
    .on('click', function(event, d) {
      if (d.data && d.data.permalink) {
        window.location.href = d.data.permalink;
      }
    })
    .on('mouseover', function(event, d) {
      // Create tooltip
      const tooltip = d3.select('body').append('div')
        .attr('class', 'chart-tooltip')
        .style('opacity', 0)
        .style('position', 'absolute')
        .style('background', 'rgba(0, 0, 0, 0.9)')
        .style('color', 'white')
        .style('padding', '10px')
        .style('border-radius', '6px')
        .style('font-size', '12px')
        .style('pointer-events', 'none')
        .style('z-index', '1000')
        .style('max-width', '200px');
      
      const formattedValue = new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        notation: 'compact',
        minimumFractionDigits: 0,
        maximumFractionDigits: 1
      }).format(d.value);

      // Add percent-of-total info to the tooltip content.
      const tooltipName = d.data.name;
      const percentValue = totalValue > 0 ? (d.value / totalValue) * 100 : 0;
      // Increase decimal places for tiny percentages so they don't round to 0%.
      const formatPercent = (value) => {
        // if (value === 0) return '0%';
        let decimals = 1;
        let text = value.toFixed(decimals);
        while (Number(text) === 0 && decimals < 6) {
          decimals += 1;
          text = value.toFixed(decimals);
        }
        return `${text}%`;
      };
      const percentText = totalValue > 0 ? formatPercent(percentValue) : '';
      const percentLine = percentText ? `<br/>Percent: ${percentText}` : '';
      tooltip.html(`<strong>${tooltipName}</strong><br/>Expenditure: ${formattedValue}${percentLine}`)
        .style('left', (event.pageX + 10) + 'px')
        .style('top', (event.pageY - 10) + 'px')
        .transition()
        .duration(200)
        .style('opacity', 1);
      
      // Highlight the rectangle
      d3.select(this)
        .style('stroke', '#FFFFFF')
        .style('stroke-width', 3);
    })
    .on('mouseout', function() {
      d3.selectAll('.chart-tooltip')
        .transition()
        .duration(200)
        .style('opacity', 0)
        .remove();
        
      // Remove highlight
      d3.select(this)
        .style('stroke', 'white')
        .style('stroke-width', 2);
    });

  // Cache the total value for percent calculations.
  const totalValue = root.value || 0;

  // Add text labels centered in each rectangle and hide when they don't fit.
  const textMargin = 8;
  const textGroups = g.selectAll("g.text-group")
    .data(root.leaves())
    .enter()
    .append("g")
    .attr("class", "text-group")
    .attr("clip-path", function(d, i) { return "url(#clip-" + i + ")"; });

  textGroups.each(function(d) {
    const rectWidth = d.x1 - d.x0;
    const rectHeight = d.y1 - d.y0;
    const centerX = d.x0 + rectWidth / 2;
    const centerY = d.y0 + rectHeight / 2;
    const textGroup = d3.select(this);
    const labelName = d.data.name;
    const percentValue = totalValue > 0 ? (d.value / totalValue) * 100 : 0;
    const percentText = totalValue > 0 ? `${percentValue.toFixed(1)}%` : '';

    const text = textGroup.append("text")
      .attr("x", centerX)
      .attr("y", centerY)
      .attr("dy", percentText ? "-0.35em" : ".35em")
      .attr("text-anchor", "middle")
      .attr("font-size", "12px")
      .attr("font-weight", "500")
      .style("pointer-events", "none")
      .attr("class", function() {
        return chartId === 'outcomeChart'
          ? "tree-label-dark"
          : (d.data && d.data.colorRaw < 0.07) ? "tree-label-dark" : "tree-label-light";
      });

    text.append("tspan")
      .attr("x", centerX)
      .text(labelName);

    if (percentText) {
      text.append("tspan")
        .attr("x", centerX)
        .attr("dy", "1.1em")
        .text(percentText);
    }

    text.style("opacity", function() {
      const bounds = this.getBBox();
      const fitsHeight = bounds.height < rectHeight - textMargin;
      const fitsWidth = bounds.width < rectWidth - textMargin;
      return (fitsHeight && fitsWidth) ? 1 : 0;
    });
  });
}

// Legacy function for backward compatibility
function populateObligationsTable(data) {
  populateTable(data, 'obligation');
}

// Function to update summary card with dynamic data
function updateSummaryCard(outlaysData) {
  try {
    if (!outlaysData || outlaysData.length === 0) {
      document.getElementById('expenditure-year').textContent = 'No data available';
      document.getElementById('expenditure-amount').textContent = 'No data available';
      document.getElementById('expenditure-change').textContent = 'No data available';
      return;
    }

    // Sort data by year to get the most recent
    const sortedData = outlaysData.sort((a, b) => parseInt(b.x) - parseInt(a.x));
    const lastYear = sortedData[0];
    const previousYear = sortedData[1];

    // 1. Update fiscal year label
    document.getElementById('expenditure-year').textContent = `FY ${lastYear.x} Expenditure`;

    // 2. Update expenditure amount with formatting
    const lastOutlay = parseFloat(lastYear.outlay) || 0;
    const formattedAmount = new Intl.NumberFormat('en-US', {
      style: 'currency',
      currency: 'USD',
      notation: 'compact',
      minimumFractionDigits: 0,
      maximumFractionDigits: 2
    }).format(lastOutlay);
    document.getElementById('expenditure-amount').textContent = formattedAmount;

    // 3. Calculate and display percentage change
    let changeText = '';
    if (!previousYear) {
      changeText = "Previous year's data does not exist";
    } else {
      const previousOutlay = parseFloat(previousYear.outlay) || 0;
      
      if (previousOutlay === 0) {
        changeText = "Previous year's data does not exist";
      } else {
        const percentageChange = ((lastOutlay - previousOutlay) / previousOutlay) * 100;
        const sign = percentageChange >= 0 ? '+' : '-';
        const formattedPercentage = Math.abs(percentageChange).toFixed(1);
        changeText = `${sign} ${formattedPercentage}% from previous year`;
      }
    }
    document.getElementById('expenditure-change').textContent = changeText;

  } catch (error) {
    document.getElementById('expenditure-year').textContent = 'Error loading data';
    document.getElementById('expenditure-amount').textContent = 'Error loading data';
    document.getElementById('expenditure-change').textContent = 'Error loading data';
  }
}
</script>
