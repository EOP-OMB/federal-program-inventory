<script>
/**
 * Formats obligations values using compact T/B/M/K suffixes.
 * @param {number} amount
 * @returns {string}
 */
function formatObligations(amount) {
  if (amount === null || amount === undefined || Number.isNaN(Number(amount))) {
    return "$0";
  }

  const value = Number(amount);
  const absValue = Math.abs(value);
  const sign = value < 0 ? "-$" : "$";

  const trillion = 1000000000000;
  const billion = 1000000000;
  const million = 1000000;
  const thousand = 1000;

  if (absValue === 0) {
    return "$0";
  }
  if (absValue >= trillion) {
    return `${sign}${(absValue / trillion).toFixed(2)}T`;
  }
  if (absValue >= billion) {
    return `${sign}${(absValue / billion).toFixed(2)}B`;
  }
  if (absValue >= million) {
    return `${sign}${(absValue / million).toFixed(2)}M`;
  }
  if (absValue >= thousand) {
    return `${sign}${(absValue / thousand).toFixed(2)}K`;
  }

  return `${sign}${absValue.toFixed(2)}`;
}

/**
 * Formats dollar values as USD currency with no decimals.
 * @param {number} amount
 * @returns {string}
 */
function formatCurrency(amount) {
  return new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    minimumFractionDigits: 0,
    maximumFractionDigits: 0,
  }).format(amount);
}

/**
 * Formats dollar values as compact USD currency (e.g. $1.2M).
 * @param {number} amount
 * @param {number} maximumFractionDigits
 * @returns {string}
 */
function formatCurrencyCompactly(amount, maximumFractionDigits = 1) {
  return new Intl.NumberFormat("en-US", {
    style: "currency",
    currency: "USD",
    notation: "compact",
    minimumFractionDigits: 0,
    maximumFractionDigits,
  }).format(amount);
}

/**
 * Standardizes dollar amounts for display with K/M/B suffixes
 * Max 4 significant figures, prioritizes fewer digits over more precise units
 * @param {number} amount - The dollar amount to format
 * @returns {string} - Formatted string like "$745.6B" or "$0.00"
 */
function standardizeDollarAmount(amount) {
  if (amount === 0 || amount === null || amount === undefined) {
    return '$0.00';
  }
  
  const absAmount = Math.abs(amount);
  const sign = amount < 0 ? '-' : '';
  
  // Trillions (1T+)
  if (absAmount >= 1000000000000) {
    const trillions = absAmount / 1000000000000;
    if (trillions >= 100) {
      // 100T+ -> one decimal place
      return `${sign}$${trillions.toFixed(1)}T`;
    } else if (trillions >= 10) {
      // 10T-99T -> one decimal place
      return `${sign}$${trillions.toFixed(1)}T`;
    } else {
      // 1T-9T -> two decimal places
      return `${sign}$${trillions.toFixed(2)}T`;
    }
  }

  // Billions (1B+)
  else if (absAmount >= 1000000000) {
    const billions = absAmount / 1000000000;
    if (billions >= 100) {
      // 100B-999B -> one decimal place
      return `${sign}$${billions.toFixed(1)}B`;
    } else if (billions >= 10) {
      // 10B-99B -> one decimal place
      return `${sign}$${billions.toFixed(1)}B`;
    } else {
      // 1B-9B -> two decimal places
      return `${sign}$${billions.toFixed(2)}B`;
    }
  }
  
  // Millions (1M+)
  else if (absAmount >= 1000000) {
    const millions = absAmount / 1000000;
    if (millions >= 1000) {
      // 1000M+ -> show as billions instead
      const billions = millions / 1000;
      return `${sign}$${billions.toFixed(1)}B`;
    } else if (millions >= 100) {
      // 100M-999M -> one decimal place
      return `${sign}$${millions.toFixed(1)}M`;
    } else if (millions >= 10) {
      // 10M-99M -> one decimal place  
      return `${sign}$${millions.toFixed(1)}M`;
    } else {
      // 1M-9M -> two decimal places
      return `${sign}$${millions.toFixed(2)}M`;
    }
  }
  
  // Thousands (1K+)
  else if (absAmount >= 1000) {
    const thousands = absAmount / 1000;
    if (thousands >= 1000) {
      // 1000K+ -> show as millions instead
      const millions = thousands / 1000;
      return `${sign}$${millions.toFixed(1)}M`;
    } else if (thousands >= 100) {
      // 100K-999K -> one decimal place
      return `${sign}$${thousands.toFixed(1)}K`;
    } else if (thousands >= 10) {
      // 10K-99K -> one decimal place
      return `${sign}$${thousands.toFixed(1)}K`;
    } else {
      // 1K-9K -> two decimal places
      return `${sign}$${thousands.toFixed(2)}K`;
    }
  }
  
  // Less than 1000 - show as whole dollars
  else {
    if (absAmount >= 100) {
      return `${sign}$${Math.round(absAmount)}`;
    } else {
      return `${sign}$${absAmount.toFixed(2)}`;
    }
  }
}

/**
 * Apply dollar standardization to all elements with data-dollar-amount attribute
 */
function applyDollarStandardization() {
  const elements = document.querySelectorAll('[data-dollar-amount]');
  elements.forEach(element => {
    const amount = parseFloat(element.getAttribute('data-dollar-amount'));
    element.textContent = standardizeDollarAmount(amount);
  });
}

// Auto-apply when DOM is ready
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', applyDollarStandardization);
} else {
  applyDollarStandardization();
}
</script>
