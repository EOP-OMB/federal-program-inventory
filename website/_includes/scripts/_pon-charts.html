<script>

function renderOutcomeTreeMap() {
  // Get the programs data from the page
  const programsData = {{ page.where_used | jsonify }};
  
  // Assemble hierarchical data structure
  const treeMapData = assembleHierarchyData(programsData, 'expenditure_amount', 'agency');
  
  if (!treeMapData) {
    console.log('No valid treemap data available');
    return;
  }

  // Render the treemap using the utility function
  try {
    renderTreeMap(treeMapData, 'outcomeChart', 'expenditure_amount', "#87CEEB");
  } catch (error) {
    console.error('Error rendering treemap:', error);
  }
}

document.addEventListener('DOMContentLoaded', function() {
  // Initialize chart when page loads
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(renderOutcomeTreeMap, 100);
    });
  } else {
    setTimeout(renderOutcomeTreeMap, 100);
  }
});
</script>
