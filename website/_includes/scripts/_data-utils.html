<!-- JavaScript logic to clean data -->
<script>

function assembleHierarchyData(unstructuredData, numberCategory, itemCategory) {
  if (!unstructuredData || unstructuredData.length === 0) {
    console.log('No data available for hierarchy assembly');
    return null;
  }
  
  // Filter out items with zero expenditure
  const nonZeroItems = unstructuredData.filter(item => 
    item[numberCategory] && parseFloat(item[numberCategory]) > 0
  );
  
  if (nonZeroItems.length === 0) {
    console.log(`No items with ${numberCategory} > 0 found for hierarchy`);
    return null;
  }
  
  // Group items by agency
  const itemGroups = {};
  
  nonZeroItems.forEach(item => {
    const identifier = item[itemCategory] || 'Unknown Item';
    const value = parseFloat(item[numberCategory]) || 0;

    if (!itemGroups[identifier]) {
      itemGroups[identifier] = {
        name: identifier,
        children: []
      };
    }
    
    // Persist permalink so treemap tiles can navigate to program pages.
    itemGroups[identifier].children.push({
      name: item.name || 'Unknown Item',
      value: value,
      permalink: item.permalink || null,
      data_source: item.data_source || null,
      program_type: item.program_type || null
    });
  });

  // Convert to the required hierarchical structure
  const hierarchyData = {
    name: 'root',
    children: Object.values(itemGroups)
  };
  
  return hierarchyData;
}

</script>
