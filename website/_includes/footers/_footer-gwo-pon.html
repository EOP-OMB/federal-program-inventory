<script>
  function initializeProgramDataSourceTooltips() {
    const tooltipTargets = document.querySelectorAll(
      "#related-programs tbody tr:not([data-total-row]) td[data-dollar-amount]"
    );

    tooltipTargets.forEach((cell) => {
      const amountText = (cell.textContent || "").trim();
      cell.classList.add("program-obligations-tooltip");
      attachProgramDataSourceTooltip(cell, {
        displayText: amountText,
        dataSource: cell.dataset.source || "Data source not available",
        addTabIndex: true,
        blurOnEscape: true
      });
    });
  }

  function initializeProgramFilters() {
    document.querySelectorAll(".program-filter").forEach((link) => {
      link.addEventListener("click", function (e) {
        e.preventDefault();

        const filterType = this.dataset.filterType;
        let filters = {
          category: []
        };

        switch (filterType) {
          case "sub-category":
            filters.category.push({
              type: "sub-category",
              parentTitle: this.dataset.categoryTitle,
              title: this.dataset.subcategoryTitle,
            });
            break;

          case "category":
            filters.category.push({
              type: "category",
              selectAll: true,
              title: this.dataset.categoryTitle,
            });
            break;
        }

        const compressed = compressFilters(filters);
        const encodedFilters = btoa(encodeURIComponent(JSON.stringify(compressed)));
        window.location.href = `/search?f=${encodedFilters}`;
      });
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    initializeProgramFilters();
    initializeProgramDataSourceTooltips();
  });
</script>
